<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosAndroid Dashboard</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <header>
        <h1>PosAndroid JaCoCo Coverage Dashboard</h1>
    </header>

    <div id="loader">
  <div class="spinner"></div>
  <p>Please wait, loading data...</p>
</div>

    <div class="breadcrumb" id="breadcrumb">Home</div>

    <div class="tabs">
        <div class="tab active" onclick="filterTab('all')">All Packages</div>
        <div class="tab" onclick="filterTab('top')">Top Performers</div>
        <div class="tab" onclick="filterTab('attention')">Needs Attention</div>
    </div>

    <div id="summary"></div>
    <div id="alert"></div>

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search...">
    </div>

    <div id="table-container"></div>

    



</body>

<script src="script.js"></script>

</html>
